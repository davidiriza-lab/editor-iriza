<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor Anuncios — capa de gráficos</title>
<style>
  @font-face { font-family: "Bebas Neue"; src: url("../fonts/bebas-neue.woff2"); }
  @font-face { font-family: "League Gothic"; src: url("../fonts/league-gothic.woff2"); }
  @font-face { font-family: "Oswald"; src: url("../fonts/oswald.woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("../fonts/instrument-serif-italic.woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: normal; src: url("../fonts/instrument-serif.woff2"); }
  @font-face { font-family: "Playfair Display"; font-style: italic; src: url("../fonts/playfair-italic.woff2"); }
  @font-face { font-family: "Anton"; src: url("../fonts/anton.woff2"); }
  @font-face { font-family: "DM Serif Display"; src: url("../fonts/dm-serif-display.woff2"); }
  @font-face { font-family: "Inter"; src: url("../fonts/inter.woff2"); }
  @font-face { font-family: "Montserrat"; src: url("../fonts/montserrat.woff2"); }
  @font-face { font-family: "Space Grotesk"; src: url("../fonts/space-grotesk.woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 500; src: url("../fonts/Poppins-Medium.ttf"); }
  @font-face { font-family: "Poppins"; font-weight: 600; src: url("../fonts/Poppins-SemiBold.ttf"); }
  @font-face { font-family: "Poppins"; font-weight: 700; src: url("../fonts/Poppins-Bold.ttf"); }
  @font-face { font-family: "Poppins"; font-weight: 800; src: url("../fonts/Poppins-ExtraBold.ttf"); }
  :root { --navy: #274760; --sky: #BAD2DF; --white: #F4FBFC; --line: #2B4356; --paper: #F5F8FA; --ink: #0B1A26; }
  html, body { margin: 0; background: transparent; }
  #stage { position: relative; overflow: hidden; font-family: Poppins, sans-serif;
           clip-path: polygon(2px 0, 100% 0, 100% 100%, 0 100%, 0 2px); /* esquina transparente: todos los PNG salen con alfa */ }
  #stage > * { position: absolute; will-change: transform, opacity; }
  .hide { display: none !important; }

  .card { box-sizing: border-box; background: var(--navy); color: var(--white); box-shadow: 0 24px 60px rgba(10, 30, 45, .35); }
  .kicker { font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--sky); }
  .title { font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
  .sub { font-weight: 500; line-height: 1.28; color: var(--sky); }
  .dash { height: 0; border-top: 3px dashed var(--sky); transform-origin: left; opacity: .7; }
  .item { display: flex; align-items: center; font-weight: 600; line-height: 1.2; }
  .ico { flex: none; border-radius: 50%; background: var(--sky); color: var(--navy); display: grid; place-items: center; }
  .ico.x { background: #E9EEF2; color: #B4483E; }
  .opt { border: 2px solid rgba(186,210,223,.35); font-weight: 600; line-height: 1.2; }
  .opt.pick { background: var(--sky); color: var(--navy); border-color: var(--sky); }
  .stamp { box-sizing: border-box; color: var(--navy); background: rgba(245,248,250,.95); font-weight: 800; line-height: 1.05;
           text-transform: uppercase; text-align: center; box-shadow: 0 18px 40px rgba(10,30,45,.28); }
  .stamp small { display: block; font-weight: 600; letter-spacing: .16em; color: var(--line); }
  .chips { display: flex; flex-wrap: wrap; }
  .chip { border-radius: 999px; background: var(--sky); color: var(--navy); font-weight: 700; display: flex; align-items: center; }
  .name { box-sizing: border-box; background: #fff; color: var(--navy); box-shadow: 0 20px 50px rgba(10,30,45,.28); }
  .name b { display: block; font-weight: 800; line-height: 1.1; }
  .name span { display: block; font-weight: 500; color: var(--line); }
  .bars { display: flex; align-items: flex-end; border-bottom: 3px solid rgba(186,210,223,.5); }
  .bar { flex: 1; background: var(--sky); border-radius: 8px 8px 0 0; transform-origin: bottom; }
  .axis { display: flex; justify-content: space-between; font-weight: 500; color: var(--sky); }
  .big { font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  .big small { font-weight: 700; color: var(--sky); letter-spacing: 0; }

  .full { left: 0; top: 0; background: var(--paper); color: var(--navy); }
  .full svg.deco { position: absolute; inset: 0; }
  .h1 { font-weight: 800; line-height: 1.08; letter-spacing: -.01em; }
  .hl { display: inline-block; background: var(--navy); color: var(--sky); }
  .w { display: inline-block; }
  .lbl { position: absolute; font-weight: 700; color: var(--navy); }
  .lbl span { display: block; font-weight: 500; color: var(--line); }
  .node { position: absolute; border-radius: 50%; background: var(--navy); color: var(--sky); display: grid; place-items: center;
          font-weight: 800; box-shadow: 0 16px 40px rgba(10,30,45,.25); }
  .block { position: absolute; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
           font-weight: 700; line-height: 1.12; box-sizing: border-box; }
  .block span { font-weight: 500; }
  .solid { background: var(--navy); color: var(--white); } .solid span { color: var(--sky); }
  .ghost { border: 5px dashed var(--line); color: var(--navy); background: rgba(186,210,223,.25); }
  .slab { position: absolute; background: var(--sky); color: var(--navy); font-weight: 800; display: grid; place-items: center;
          box-shadow: 0 16px 40px rgba(10,30,45,.2); text-align: center; }
  .row { position: absolute; display: flex; align-items: center; box-sizing: border-box; font-weight: 700; transform-origin: left; white-space: nowrap; }
  .rowlbl { position: absolute; font-weight: 700; color: var(--navy); }
  .note { position: absolute; font-weight: 500; color: var(--line); }

  /* subtítulos */
  #subs { left: 0; width: 100%; text-align: center; pointer-events: none; z-index: 5; }
  #subs .line { display: inline-block; max-width: 88%; }
  #subs .sw { display: inline-block; font-weight: 800; color: #fff; paint-order: stroke fill; margin: 0 .12em; padding: .02em .16em .06em;
              border-radius: .22em; text-shadow: 0 .08em .3em rgba(0,0,0,.35); }
  #subs .sw.key { color: var(--sky); }
  #subs .sw.on { background: var(--navy); color: #fff; -webkit-text-stroke: 0 !important; text-shadow: none; }
  #flash { left: 0; top: 0; background: #fff; z-index: 6; }
  .full.dark { background: #0D1A24; color: #F4FBFC; }
  .full.dark .h1, .full.dark .lbl, .full.dark .rowlbl { color: #F4FBFC; }
  .full.dark .lbl span, .full.dark .note { color: #BAD2DF; }
  .full.dark .node { background: #16324a; border: 4px solid #BAD2DF; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="personajes.js"></script>
<script>
// ---------- datos del proyecto ----------
const qs = new URLSearchParams(location.search);
const PROJ = qs.get("proj");
function load(src) { return new Promise((ok, err) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = err; document.head.appendChild(s); }); }

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.7, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const css = (el, o) => Object.assign(el.style, o);

const ICONS = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  house: '<path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>',
  kids: '<circle cx="8" cy="7.5" r="3"/><circle cx="16.5" cy="10" r="2.3"/><path d="M3 20v-1.5a5 5 0 0 1 10 0V20"/><path d="M13 20v-1a3.6 3.6 0 0 1 7.2 0v1"/>',
  company: '<path d="M4 20.5V4.5h10v16"/><path d="M14 9.5h6v11"/><path d="M2.5 20.5h19"/><path d="M7.5 8h3M7.5 12h3M7.5 16h3M17 13.5v.01M17 17v.01"/>',
  target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/>',
  trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3.2 4M16 6h3a3 3 0 0 1-3.2 4"/><path d="M12 13v4M8.5 20.5h7M9.5 17h5v3.5h-5z"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  person: '<circle cx="12" cy="7.5" r="3.5"/><path d="M5 20.5v-1a7 7 0 0 1 14 0v1"/>',
  heart: '<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/><path d="M7 12.5h3l1.5-2.5 2 4 1.5-1.5h2"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  cash: '<rect x="3" y="6.5" width="18" height="11" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9.5v.01M17.5 14.5v.01"/>',
  doc: '<path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6"/>',
  box: '<path d="M3.5 8L12 3.5 20.5 8v8.5L12 21l-8.5-4.5z"/><path d="M3.5 8L12 12.5 20.5 8M12 12.5V21"/>',
  car: '<path d="M4 16.5h16v-4l-2-4.5H6l-2 4.5z"/><circle cx="7.5" cy="16.5" r="1.8"/><circle cx="16.5" cy="16.5" r="1.8"/><path d="M4 12.5h16"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', bolt: '<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>',
  calc: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11v.01M8 15h2M12 15h2M16 15v3"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5.5 3.5-5.5 3.5z"/>',
  baby: '<circle cx="12" cy="8" r="4"/><path d="M6 20.5c0-3.6 2.7-6 6-6s6 2.4 6 6"/><path d="M10.5 8h.01M13.5 8h.01"/>',
};
const icon = (n, sw = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%">${ICONS[n] || ICONS.check}</svg>`;

let W, H, V, U, F, stage, E, cues = [], chunks = [];

// ---------- colocación ----------
function place(el, c, w) {
  w = w ?? (V ? 0.90 * W : 600 * U);
  const x = V ? (W - w) / 2 : (c.side === "left" ? 56 * U : W - 56 * U - w);
  const top = c.top ?? (V ? (c.zone === "mid" ? 0.48 * H : 0.045 * H) : 150 * U);
  css(el, { left: x + "px", top: top + "px", width: w + "px", borderRadius: 28 * U * F + "px", padding: `${30 * U * F}px ${34 * U * F}px ${32 * U * F}px` });
}
const fs = px => px * U * F + "px";
function sideIO(el, c, t) {
  const a = eOut(prog(t, c.start, c.start + .4)), b = eInOut(prog(t, c.end - .32, c.end));
  if (V) css(el, { opacity: a * (1 - b), filter: `blur(${((1 - a) + b) * 8 * U}px)`, transform: `translateY(${(1 - a) * -60 * U - b * 30 * U}px) scale(${lerp(.95, 1, a) * lerp(1, .98, b)})` });
  else {
    const dir = c.side === "left" ? -1 : 1;
    css(el, { opacity: a * (1 - b), transform: `translate(${(1 - a) * 90 * U * dir}px, ${-b * 24 * U}px)` });
  }
}
function fullIO(el, c, t) {
  const inFx = c.inFx || "iris", outFx = c.hold ? "none" : (c.outFx || "slide");
  const a = prog(t, c.start, c.start + (c.inDur || (inFx === "iris" ? .42 : .38))), b = prog(t, c.end - (c.outDur || .34), c.end);
  const ox = (c.ox ?? .5) * W, oy = (c.oy ?? (V ? .30 : .31)) * H;
  let clip = "none", tr = "", op = 1, bl = 0;
  if (inFx === "iris" && a < 1) clip = `circle(${eInOut(a) * Math.hypot(W, H)}px at ${ox}px ${oy}px)`;
  if (inFx === "slide" && a < 1) { const e = eInOut(a); tr = `translateY(${(1 - e) * 16}%) scale(${lerp(1.04, 1, e)})`; bl = (1 - e) * 16; op = clamp(e * 2); }
  if (inFx === "fade" && a < 1) { op = eOut(a); bl = (1 - a) * 18; }
  if (b > 0 && outFx === "slide") { const e = eInOut(b); tr = `translateY(${-e * 14}%) scale(${lerp(1, .98, e)})`; bl = Math.max(bl, e * 16); op = Math.min(op, 1 - e); }
  if (b > 0 && outFx === "zoom") { const e = eInOut(b), zx = (c.zx ?? .5) * W, zy = (c.zy ?? .42) * H;
    tr = `translate(${zx}px,${zy}px) scale(${lerp(1, 5, e * e)}) translate(${-zx}px,${-zy}px)`; op = 1 - clamp((e - .35) / .65); bl = e * 10; }
  if (b > 0 && outFx === "fade") { op = 1 - b; bl = b * 16; }
  css(el, { clipPath: clip, transform: tr, opacity: op, filter: bl > .3 ? `blur(${bl * U}px)` : "", transformOrigin: "0 0" });
}
// texto cinético palabra por palabra (desenfoque → nítido en 0.15 s), devuelve html + función para animarlo
function kinetic(words, { size = 64, weight = 700, font = "Helvetica", color = "#fff", keyColor = "#BAD2DF", keyFont = "'Chamberi Headline'", align = "center" } = {}) {
  return words.map(w => `<span class="w" data-at="${w.at}" style="font-family:${w.key ? keyFont : font};font-style:${w.key ? "italic" : "normal"};font-weight:${weight};
    font-size:${size * U * (V ? 1 : .78) * (w.key ? 1.3 : 1)}px;color:${w.key ? keyColor : color};margin:0 ${size * .12 * U}px;display:inline-block">${w.t}</span>`).join("");
}
function animKinetic(root, t) { root.querySelectorAll("[data-at]").forEach(n => { const p = eOut(prog(t, +n.dataset.at - .05, +n.dataset.at + .25));
  css(n, { opacity: p, filter: `blur(${(1 - p) * 7 * U}px)`, transform: `translateY(${(1 - p) * 14 * U}px) scale(${lerp(.92, 1, p)})` }); }); }
// fondo vivo: anillos que respiran + partículas que derivan (para que nunca quede quieto)
function liveBg(th, cx, cy, seed = 1) {
  return `<rect width="${W}" height="${H}" fill="${th.bg}"/><g data-rings>${Array.from({ length: 9 }, (_, i) => `<circle cx="${cx}" cy="${cy}" r="${(1250 - i * 135) * U}" fill="#fff" fill-opacity="0.012"/>`).join("")}</g>
    <g data-dust>${Array.from({ length: 26 }, (_, i) => `<circle r="${(1.5 + rnd(i * 7 + seed) * 2.5) * U}" fill="${th.acc}" opacity="${.15 + rnd(i * 3 + seed) * .35}" data-p="${i}"/>`).join("")}</g>`;
}
function animBg(el, t, seed = 1) {
  const r = el.querySelector("[data-rings]"); if (r) r.setAttribute("transform", `translate(${W / 2} ${H * .45}) scale(${1 + .03 * Math.sin(t * .9)}) translate(${-W / 2} ${-H * .45})`);
  el.querySelectorAll("[data-dust] circle").forEach(c => { const i = +c.dataset.p, sp = .02 + rnd(i + seed) * .03;
    c.setAttribute("cx", ((rnd(i * 5 + seed) + t * sp * (rnd(i) > .5 ? 1 : -1)) % 1 + 1) % 1 * W); c.setAttribute("cy", ((rnd(i * 11 + seed) - t * sp * .6) % 1 + 1) % 1 * H); });
}
const pop = (el, t, at, { dy = 24, dx = 0, d = .45, sc = 0 } = {}) => {
  const p = eOut(prog(t, at, at + d)), s = sc ? back(prog(t, at, at + d * 1.3)) : 1;
  css(el, { opacity: p, transform: `translate(${(1 - p) * dx * U}px, ${(1 - p) * dy * U}px) scale(${sc ? lerp(sc, 1, s) : 1})` });
};
function dashedPath(d, { color = "var(--line)", w = 5, dash = "20 17" } = {}) {
  const id = "m" + Math.random().toString(36).slice(2);
  return {
    html: `<svg class="deco" viewBox="0 0 ${W} ${H}"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-200" y="-200" width="${W + 400}" height="${H + 400}">
      <path d="${d}" fill="none" stroke="#fff" stroke-width="${30 * U}" stroke-linecap="round" data-mask/></mask></defs>
      <path d="${d}" mask="url(#${id})" fill="none" stroke="${color}" stroke-width="${w * U}" stroke-linecap="round" stroke-dasharray="${dash.split(" ").map(x => x * U).join(" ")}" data-path/></svg>`,
    bind(root) {
      const m = root.querySelector("[data-mask]"), p = root.querySelector("[data-path]"), L = p.getTotalLength();
      m.setAttribute("stroke-dasharray", `${L + 60} ${L + 60}`);
      return { L, path: p, set: x => m.setAttribute("stroke-dashoffset", (L + 60) * (1 - x)) };
    },
  };
}

// ---------- componentes ----------
const C = {};
const head = c => `${c.kicker ? `<div class="kicker" style="font-size:${fs(21)};margin-bottom:${10 * U * F}px">${c.kicker}</div>` : ""}`;
const items = (list, ic = "check") => list.map(i => `<div class="item" style="gap:${16 * U * F}px;margin-top:${18 * U * F}px;font-size:${fs(30)}">
   <div class="ico ${i.icon === "x" ? "x" : ""}" style="width:${46 * U * F}px;height:${46 * U * F}px;padding:${10 * U * F}px;box-sizing:border-box">${icon(i.icon || ic, 2.6)}</div><div>${i.t}</div></div>`).join("");

C.card = {
  make(el, c) { el.className = "card"; place(el, c, c.w);
    el.innerHTML = `${head(c)}<div class="title" style="font-size:${fs(c.size || 48)}">${c.title}</div>
      <div class="dash" style="margin:${18 * U * F}px 0 ${4 * U}px"></div>${c.sub ? `<div class="sub" style="font-size:${fs(28)};margin-top:${12 * U * F}px">${c.sub}</div>` : ""}`; },
  draw(el, c, t) { sideIO(el, c, t); el.querySelector(".dash").style.transform = `scaleX(${eOut(prog(t, c.start + .3, c.start + 1))})`;
    const s = el.querySelector(".sub"); if (s) pop(s, t, c.subAt ?? c.start + .35); },
};
C.list = {
  make(el, c) { el.className = "card"; place(el, c, c.w);
    el.innerHTML = `${head(c)}${c.title ? `<div class="title" style="font-size:${fs(38)}">${c.title}</div>` : ""}${items(c.items)}`; },
  draw(el, c, t) { sideIO(el, c, t); el.querySelectorAll(".item").forEach((n, k) => pop(n, t, c.items[k].at, { dx: V ? 0 : (c.side === "left" ? -30 : 30), dy: V ? 24 : 0 })); },
};
C.choice = {
  make(el, c) { el.className = "card"; place(el, c, c.w);
    el.innerHTML = `${head(c)}<div class="title" style="font-size:${fs(38)}">${c.question}</div>
      ${c.options.map(o => `<div class="opt" style="margin-top:${16 * U * F}px;padding:${18 * U * F}px ${22 * U * F}px;border-radius:${18 * U * F}px;font-size:${fs(29)}">${o}</div>`).join("")}`; },
  draw(el, c, t) { sideIO(el, c, t); const p = prog(t, c.pickAt ?? 1e9, (c.pickAt ?? 1e9) + .35);
    el.querySelectorAll(".opt").forEach((n, k) => { pop(n, t, c.optAt[k]); n.classList.toggle("pick", k === c.pick && p > 0);
      if (k === c.pick) n.style.transform += ` scale(${1 + .06 * Math.sin(p * Math.PI)})`; else if (p > 0) n.style.opacity = Math.min(+n.style.opacity, 1 - .55 * p); }); },
};
C.stamp = {
  make(el, c) { el.className = "stamp"; const w = c.w ?? (V ? 0.72 * W : 420 * U); place(el, c, w);
    css(el, { padding: `${18 * U * F}px ${30 * U * F}px`, border: `${6 * U * F}px solid var(--navy)`, borderRadius: 18 * U * F + "px", fontSize: fs(46) });
    if (V && c.top == null) el.style.top = 0.07 * H + "px";
    el.innerHTML = `${c.small ? `<small style="font-size:${fs(20)};margin-bottom:${6 * U}px">${c.small}</small>` : ""}${c.text}`; },
  draw(el, c, t) { const p = prog(t, c.start, c.start + .28), b = prog(t, c.end - .3, c.end);
    const s = lerp(2.4, 1, eOut(p)), sh = p >= 1 ? Math.sin((t - c.start) * 60) * 6 * U * Math.max(0, 1 - (t - c.start - .28) * 4) : 0;
    css(el, { opacity: clamp(p * 3) * (1 - b), transform: `translate(${sh}px,0) rotate(${c.rot ?? -5}deg) scale(${s})` }); },
};
C.chips = {
  make(el, c) { el.className = "card"; place(el, c, c.w);

      const side = k.side, sameSide = c.cables.slice(0, i).filter(x => x.side === side).length;
      const py = side === "bottom" ? cy + bh / 2 : portY[sameSide % 2];
      const px = side === "left" ? g.x0 - 30 * U : side === "right" ? g.x0 + bw + 30 * U : cx;
      return { ...k, px, py, i };
    });
    const grad = `<linearGradient id="mfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${th.acc}"/><stop offset="1" stop-color="${th.accDark}"/></linearGradient>
      <linearGradient id="mplug" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5F5F5"/><stop offset=".5" stop-color="#C9C9C9"/><stop offset="1" stop-color="#8F8F8F"/></linearGradient>
      <filter id="mglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${4 * U}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <clipPath id="minner"><rect x="${g.x0 + 9 * U}" y="${g.y0 + 9 * U}" width="${bw - 18 * U}" height="${bh - 18 * U}" rx="${28 * U}"/></clipPath>`;
    el.innerHTML = `<svg class="deco" viewBox="0 0 ${W} ${H}"><defs>${grad}</defs>${ringsBg(th, cx, cy)}
      <g data-wires></g><g data-pulses filter="url(#mglow)"></g>
      ${el._cables.map(k => `<rect data-port${k.i} fill="#6E6E6E" rx="${4 * U}"/>`).join("")}
      <g clip-path="url(#minner)"><path data-fill fill="url(#mfill)"/></g>
      <rect x="${g.x0}" y="${g.y0}" width="${bw}" height="${bh}" rx="${38 * U}" fill="none" stroke="#8A8A8A" stroke-width="${7 * U}"/>
      <rect x="${cx - 32 * U}" y="${g.y0 - 20 * U}" width="${64 * U}" height="${16 * U}" rx="${4 * U}" fill="url(#mplug)"/>
      <text data-title x="${cx}" y="${g.y0 - 46 * U}" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="${40 * U}" letter-spacing="${2 * U}">${c.title || "ÉXITO"}</text>
      <text data-pct x="${cx}" y="${cy + 16 * U}" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="${50 * U}" fill="#fff">0%</text>
      <g data-plugs></g><g data-labels></g>
      ${c.logo ? `<text x="${cx}" y="${0.80 * H}" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="${40 * U}" fill="${th.acc}" opacity=".9">${c.logo}</text>` : ""}</svg>`;
  },
  draw(el, c, t) {
    fullIO(el, c, t);
    const g = el._g, th = g.th, q = s => el.querySelector(s);
    let wires = "", plugs = "", labels = "", pulses = "";
    const unplug = c.unplugAt ?? 1e9;
    for (const k of el._cables) {
      const fly = eOut(prog(t, k.at, k.at + .7)), back_ = eInOut(prog(t, unplug + k.i * .05, unplug + k.i * .05 + .8));
      const slack = (1 - prog(t, k.at + .65, k.at + 1.35)) * (1 - fly * 0) + back_ * .8;   // flojo al volar, tenso al conectar
      const dirX = k.side === "left" ? -1 : k.side === "right" ? 1 : 0, dirY = k.side === "bottom" ? 1 : 0;
      const far = dirX ? (dirX < 0 ? -80 * U : W + 80 * U) : H + 80 * U;
      // posición del enchufe: entra desde lejos hasta el puerto (y se retira al desconectar)
      const off = (1 - fly + back_) * (dirX ? 520 * U : 600 * U);
      const ex = k.px + dirX * (off + 26 * U), ey = k.py + dirY * (off + 26 * U);
      // cable: de la orilla al enchufe, con ondulación que se apaga al tensarse
      const N = 48; let d = "";
      for (let i = 0; i <= N; i++) {
        const u = i / N, env = Math.sin(Math.PI * u) * Math.pow(u, .3);
        const amp = 46 * U * slack * env, wav = Math.sin(u * 9 + t * 7 + k.i * 1.7) + .5 * Math.sin(u * 17 - t * 5);
        let x, y;
        if (dirX) { x = lerp(far, ex + dirX * 24 * U, u); y = k.py + amp * wav; }
        else { y = lerp(far, ey + 24 * U, u); x = k.px + amp * wav; }
        d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      }
      if (fly > 0) wires += `<path d="${d}" fill="none" stroke="${th.line}" stroke-width="${3 * U}" stroke-linecap="round"/>`;
      // enchufe (cuerpo metálico + punta)
      if (fly > 0) {
        if (dirX) plugs += `<rect x="${dirX < 0 ? ex - 24 * U : ex - 26 * U}" y="${k.py - 12 * U}" width="${50 * U}" height="${24 * U}" rx="${5 * U}" fill="url(#mplug)"/>`;
        else plugs += `<rect x="${k.px - 12 * U}" y="${ey - 26 * U}" width="${24 * U}" height="${50 * U}" rx="${5 * U}" fill="url(#mplug)"/>`;
        const lo = clamp(fly * 1.4 - .3) * (1 - back_);
        if (dirX < 0) labels += `<text x="${ex - 60 * U}" y="${k.py - 24 * U}" text-anchor="end" font-family="Poppins" font-weight="500" font-size="${30 * U}" fill="${th.text}" opacity="${lo}">${k.label}</text>`;
        else if (dirX > 0) labels += `<text x="${ex + 60 * U}" y="${k.py - 24 * U}" text-anchor="start" font-family="Poppins" font-weight="500" font-size="${30 * U}" fill="${th.text}" opacity="${lo}">${k.label}</text>`;
        else labels += `<text transform="translate(${k.px - 22 * U} ${ey + 70 * U}) rotate(-90)" text-anchor="end" font-family="Poppins" font-weight="500" font-size="${30 * U}" fill="${th.text}" opacity="${lo}">${k.label}</text>`;
      }
      // pulsos de energía hacia la batería
      const p0 = k.at + 1.2;
      if (t > p0 && t < unplug) {
        const len = dirX ? Math.abs(far - (k.px + dirX * 50 * U)) : far - (k.py + 50 * U), sp = 640 * U;
        for (let n = 0; n < 60; n++) {
          const s0 = p0 + n * .34 + rnd(n + k.i * 31) * .22; if (s0 > t) break;
          const dd = (t - s0) * sp; if (dd > len) continue;
          const x = dirX ? far - dirX * dd : k.px, y = dirX ? k.py : far - dd;
          pulses += dirX ? `<rect x="${x - 11 * U}" y="${y - 5 * U}" width="${22 * U}" height="${10 * U}" rx="${5 * U}" fill="${th.acc}"/>`
                         : `<rect x="${x - 5 * U}" y="${y - 11 * U}" width="${10 * U}" height="${22 * U}" rx="${5 * U}" fill="${th.acc}"/>`;
        }
      }
      const port = q(`[data-port${k.i}]`);
      if (dirX) { port.setAttribute("x", dirX < 0 ? k.px - 4 * U : k.px - 26 * U); port.setAttribute("y", k.py - 15 * U); port.setAttribute("width", 30 * U); port.setAttribute("height", 30 * U); }
      else { port.setAttribute("x", k.px - 15 * U); port.setAttribute("y", k.py - 4 * U); port.setAttribute("width", 30 * U); port.setAttribute("height", 30 * U); }
    }
    q("[data-wires]").innerHTML = wires; q("[data-plugs]").innerHTML = plugs; q("[data-labels]").innerHTML = labels; q("[data-pulses]").innerHTML = pulses;
    // líquido con ola + porcentaje
    const L = eInOut(prog(t, c.fillFrom, c.fillTo)), fade = 1 - prog(t, unplug + .3, unplug + 1.1);
    const top = g.y0 + g.bh - L * g.bh, amp = (L > 0 && L < 1 ? 12 : 6) * U;
    let f = `M ${g.x0} ${g.y0 + g.bh + 10 * U}`;
    for (let i = 0; i <= 30; i++) { const x = g.x0 + g.bw * i / 30; f += ` L ${x} ${top + amp * Math.sin(i / 30 * 7 + t * 4) + amp * .5 * Math.sin(i / 30 * 13 - t * 3)}`; }
    f += ` L ${g.x0 + g.bw} ${g.y0 + g.bh + 10 * U} Z`;
    q("[data-fill]").setAttribute("d", L > 0 ? f : ""); q("[data-fill]").setAttribute("opacity", fade);
    q("[data-pct]").textContent = Math.round(L * 100) + "%";
    q("[data-title]").setAttribute("fill", L > .02 && fade > .5 ? th.acc : "#D0D0D0");
  },
};

// Figura de palitos (cinemática simple). pose: run | walk | stand | cheer
function stick(x, y, h, t, pose, ph = 0, col = "#F0BE2C", sw = 0.13) {
  const f = pose === "walk" ? 1.6 : 2.3, p = (t * f + ph) * Math.PI * 2;
  const bob = pose === "run" ? -Math.abs(Math.sin(p)) * .05 : pose === "walk" ? -Math.abs(Math.sin(p)) * .02 : pose === "cheer" ? -Math.abs(Math.sin(p * .5)) * .04 : 0;
  const lean = pose === "run" ? .3 : pose === "walk" ? .06 : 0;
  const hip = [0, -.46 + bob], sh = [Math.sin(lean) * .34, hip[1] - Math.cos(lean) * .34], head = [sh[0] + Math.sin(lean) * .17, sh[1] - .17];
  const leg = (a, k) => { const kn = [hip[0] + Math.sin(a) * .23, hip[1] + Math.cos(a) * .23]; const ft = [kn[0] + Math.sin(a - k) * .24, kn[1] + Math.cos(a - k) * .24]; return `M${hip} L${kn} L${ft}`; };
  const arm = (a, k) => { const el_ = [sh[0] + Math.sin(a) * .17, sh[1] + Math.cos(a) * .17]; const hd = [el_[0] + Math.sin(a + k) * .16, el_[1] + Math.cos(a + k) * .16]; return `M${sh} L${el_} L${hd}`; };
  let legs, arms;
  if (pose === "run") {
    legs = leg(.95 * Math.sin(p) + .1, .2 + 1.35 * Math.max(0, Math.sin(p - 1.2))) + leg(.95 * Math.sin(p + Math.PI) + .1, .2 + 1.35 * Math.max(0, Math.sin(p + Math.PI - 1.2)));
    arms = arm(-1.0 * Math.sin(p) + .15, 1.6) + arm(-1.0 * Math.sin(p + Math.PI) + .15, 1.6);
  } else if (pose === "walk") {
    legs = leg(.4 * Math.sin(p), .1 + .4 * Math.max(0, Math.sin(p - 1.2))) + leg(.4 * Math.sin(p + Math.PI), .1 + .4 * Math.max(0, Math.sin(p + Math.PI - 1.2)));
    arms = arm(-.35 * Math.sin(p), .3) + arm(-.35 * Math.sin(p + Math.PI), .3);
  } else if (pose === "cheer") {
    legs = leg(.12, 0) + leg(-.12, 0); const w = .25 * Math.sin(p);
    arms = arm(Math.PI - .55 + w, -.15) + arm(-Math.PI + .55 - w, .15);
  } else { legs = leg(.1, 0) + leg(-.1, 0); arms = arm(.18, 0) + arm(-.18, 0); }
  return `<g transform="translate(${x} ${y}) scale(${h})"><path d="${legs}${arms}M${sh} L${hip}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${head[0]}" cy="${head[1]}" r=".115" fill="${col}"/></g>`;
}

// Silueta de persona en la multitud: cabeza + torso relleno + brazos (arriba celebrando o abajo)
function fan(x, y, h, t, ph, armsUp) {
  const p = (t * 1.6 + ph) * Math.PI * 2, bob = -Math.abs(Math.sin(p * .5)) * .035, w = armsUp ? .22 * Math.sin(p) : 0;
  const sy = -.66 + bob, arm = (sg) => armsUp
    ? `M${sg * .15} ${sy + .03} L${sg * (.24 + .05 * Math.sin(p + sg))} ${sy - .2 - w * sg * .3} L${sg * (.27 + .06 * Math.sin(p + sg))} ${sy - .42 - w * sg * .4}`
    : `M${sg * .16} ${sy + .04} L${sg * .2} ${sy + .32}`;
  return `<g transform="translate(${x} ${y}) scale(${h})">
    <path d="M -.17 ${sy + .04} Q -.19 ${sy - .02} -.11 ${sy - .03} L .11 ${sy - .03} Q .19 ${sy - .02} .17 ${sy + .04} L .14 0 L -.14 0 Z" fill="url(#rgrey)"/>
    <path d="${arm(-1)}${arm(1)}" fill="none" stroke="url(#rgrey)" stroke-width=".1" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="${sy - .15}" r=".12" fill="#B5B5B5"/></g>`;
}

// Corredor + multitud que llega y se va (ref. 2)
C.runner = {
  make(el, c) {
    el.className = "full"; css(el, { width: W + "px", height: H + "px" });
    const th = THEMES[c.theme || E.theme || "dark"];
    el._th = th;
    // multitud en perspectiva: filas atrás (chicas, arriba) a adelante (grandes, abajo)
    const crowd = []; const rows = c.rows || 9;
    const rows_ = c.rows || 13;
    for (let r = 0; r < rows_; r++) {
      const v = r / (rows_ - 1), y = lerp(0.19, 0.47, v) * H, hgt = lerp(50, 104, v) * U, wd = lerp(110, 265, v) * U, n = Math.round(lerp(7, 13, v));
      for (let i = 0; i < n; i++) crowd.push({ x: (i / (n - 1) - .5) * wd * 2 + (rnd(r * 13 + i) - .5) * 44 * U, y: y + (rnd(r * 7 + i) - .5) * 26 * U,
        h: hgt * lerp(.88, 1.1, rnd(r * 17 + i * 3)), ph: rnd(r * 3 + i * 5), arms: rnd(r * 29 + i * 11) < .7 });
    }
    el._crowd = crowd;
    el.innerHTML = `<svg class="deco" viewBox="0 0 ${W} ${H}"><defs>
      <linearGradient id="rgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${th.acc}"/><stop offset="1" stop-color="${th.accDark}"/></linearGradient>
      <linearGradient id="rgrey" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4C4C4"/><stop offset="1" stop-color="#555555"/></linearGradient>
      <linearGradient id="rfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <mask id="rmask" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><rect x="0" y="${(c.floor || .585) * H}" width="${W}" height="${0.2 * H}" fill="url(#rfade)"/></mask>
      <filter id="rblur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="${4.5 * U}"/></filter></defs>
      <rect width="${W}" height="${H}" fill="${th.bg}"/>
      <g data-crowd filter="url(#rblur)" opacity=".85"></g>
      <text data-clbl text-anchor="middle" font-family="Poppins" font-weight="500" font-size="${44 * U}" fill="${th.acc}">${c.crowdLabel || ""}</text>
      <text data-hlbl x="${W / 2}" text-anchor="middle" font-family="Poppins" font-weight="500" font-size="${34 * U}" fill="${th.acc}">${c.heroLabel || ""}</text>
      <g data-hero></g><g data-refl mask="url(#rmask)"></g>
      ${c.logo ? `<text x="${W / 2}" y="${0.83 * H}" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="${40 * U}" fill="${th.acc}" opacity=".9">${c.logo}</text>` : ""}</svg>`;
  },
  draw(el, c, t) {
    fullIO(el, c, t);
    const q = s => el.querySelector(s), th = el._th, fy = (c.floor || .585) * H, hh = (c.heroSize || 175) * U, hx = W / 2 - 10 * U;
    const hero = stick(hx, fy, hh, t, c.pose || "run", 0, "url(#rgold)", .17);
    q("[data-hero]").innerHTML = hero;
    q("[data-refl]").innerHTML = `<g transform="translate(0 ${2 * fy}) scale(1 -1)" opacity=".55">${hero}</g>`;
    q("[data-hlbl]").setAttribute("y", fy - hh - 34 * U);
    // la multitud entra desde la derecha y sale por la izquierda
    const a = eOut(prog(t, c.crowdIn, c.crowdIn + 1.1)), b = eInOut(prog(t, c.crowdOut, c.crowdOut + 1.1));
    const dx = (1 - a) * (W * .95) - b * (W * .95), cxw = W / 2 + 40 * U + dx;
    const on = t >= c.crowdIn && t <= c.crowdOut + 1.1;
    q("[data-crowd]").innerHTML = on ? el._crowd.map(p => fan(cxw + p.x, p.y + p.h, p.h, t, p.ph, p.arms)).join("") : "";
    const lb = q("[data-clbl]"); lb.setAttribute("x", cxw); lb.setAttribute("y", 0.375 * H); lb.setAttribute("opacity", on ? 1 : 0);
  },
};

// Escena con personajes (monitos de palito) y línea de tiempo por actor.
// actor: { label, x (0..1), y (piso 0..1), h (px a 1080), facing, color: "acc"|"grey", kid, phase, keys: [{ at, pose, x }] }
C.scene = {
  make(el, c) {
    el.className = "full"; css(el, { width: W + "px", height: H + "px" });
    const th = el._th = THEMES[c.theme || E.theme || "dark"];
    el.innerHTML = `<svg class="deco" viewBox="0 0 ${W} ${H}"><defs>
      <linearGradient id="sfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <filter id="pblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="${4 * U}"/></filter></defs>
      ${c.bg === false ? "" : ringsBg(th, W / 2, (c.floor || .6) * H - 150 * U)}
      <g data-refl></g><g data-actors></g><g data-texts></g></svg>`;
    if (c.reflection !== false) {
      const fy = (c.floor || .6) * H;
      el.querySelector("defs").insertAdjacentHTML("beforeend", `<mask id="smask" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><rect x="0" y="${fy}" width="${W}" height="${0.22 * H}" fill="url(#sfade)"/></mask>`);
      el.querySelector("[data-refl]").setAttribute("mask", "url(#smask)");
    }
  },
  draw(el, c, t) {
    fullIO(el, c, t);
    const th = el._th, PJ = window.PERSONAJES, lt = t - c.start;
    let actors = "", texts = "";
    for (const a of c.actors || []) {
      const ks = a.keys || [{ at: 0, pose: a.pose || "stand" }];
      let i = 0; while (i + 1 < ks.length && lt >= ks[i + 1].at) i++;
      const k = ks[i], prev = ks[i - 1];
      // posición: se mueve hacia la x de la siguiente clave a velocidad constante (con arranque/frenado suaves)
      let xf = k.x ?? (prev && prev.x) ?? a.x ?? .5;
      const nx = ks[i + 1];
      if (nx && nx.x != null && k.x != null) { const q = clamp((lt - k.at) / (nx.at - k.at)); xf = lerp(k.x, nx.x, .55 * q + .45 * q * q * (3 - 2 * q)); }
      if (lt < ks[0].at) continue;
      const blendX = prev ? prog(lt, k.at, k.at + (k.blend ?? .3)) : 1;
      const fy = (a.y ?? c.floor ?? .6) * H, h = (a.h || 300) * U;
      const o = { x: xf * W, y: fy, h, t: lt, phase: a.phase || 0, facing: a.facing || 1, color: a.color || "acc", kid: a.kid, blur: a.blur, prop: k.prop || a.prop,
                  pose: k.pose, blend: blendX < 1 ? { from: prev.pose, to: k.pose, x: blendX } : null, opacity: a.fadeIn ? prog(lt, ks[0].at, ks[0].at + .4) : 1 };
      const fig = PJ.draw(o, th);
      actors += fig;
      if (c.reflection !== false && (a.y == null)) el._refl = (el._refl || "") + `<g transform="translate(0 ${2 * fy}) scale(1 -1)" opacity=".5">${fig}</g>`;
      if (a.label) texts += `<text x="${xf * W}" y="${fy - h * (a.labelUp || 1.3)}" text-anchor="middle" font-family="Poppins" font-weight="500" font-size="${(a.labelSize || 34) * U}" fill="${a.color === "grey" ? "#BDBDBD" : th.acc}" opacity="${a.labelAt ? prog(lt, a.labelAt, a.labelAt + .4) : 1}">${a.label}</text>`;
    }
    for (const x of c.texts || []) {
      const p = eOut(prog(lt, x.at, x.at + .5)), b = x.out ? prog(lt, x.out, x.out + .4) : 0;
      texts += `<text x="${x.x * W}" y="${x.y * H + (1 - p) * 20 * U}" text-anchor="middle" font-family="Poppins" font-weight="${x.weight || 600}" font-size="${(x.size || 44) * U}" fill="${x.color || (x.acc ? th.acc : th.text)}" opacity="${p * (1 - b)}">${x.t}</text>`;
    }
    el.querySelector("[data-actors]").innerHTML = actors; el.querySelector("[data-texts]").innerHTML = texts;
    el.querySelector("[data-refl]").innerHTML = el._refl || ""; el._refl = "";
  },
};

// ================= Escenas del anuncio "A los 40" (reutilizables) =================
const TH = c => THEMES[c.theme || E.theme || "marino"];
const fullBase = (el, c, extra = "") => { el.className = "full"; css(el, { width: W + "px", height: H + "px" }); el._th = TH(c);
  el.innerHTML = `<svg class="deco" viewBox="0 0 ${W} ${H}">${liveBg(el._th, W / 2, H * .45, c.start)}${extra}</svg>`; return el.querySelector("svg"); };
const htmlLayer = (el, inner) => { const d = document.createElement("div"); css(d, { position: "absolute", inset: 0 }); d.innerHTML = inner; el.appendChild(d); return d; };

// Contador con anillo (gancho): el anillo se llena mientras el número sube; palabras debajo al ritmo de la voz
C.counter = {
  make(el, c) { const th = TH(c), cx = W / 2, cy = (c.cy || .40) * H, R = (c.r || 230) * U;
    fullBase(el, c, `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="${18 * U}"/>
      <circle data-arc cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${th.acc}" stroke-width="${18 * U}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})" stroke-dasharray="0 9999" style="filter:drop-shadow(0 0 ${14 * U}px ${th.acc})"/>
      <g data-orb>${Array.from({ length: 10 }, (_, i) => `<circle r="${4 * U}" fill="${th.acc}" opacity="${.3 + .07 * i}" data-o="${i}"/>`).join("")}</g>`);
    el._g = { cx, cy, R };
    htmlLayer(el, `<div data-num style="position:absolute;left:0;right:0;top:${cy - 130 * U}px;text-align:center;font:800 ${210 * U}px/1 Helvetica;color:#fff;letter-spacing:-.04em">0</div>
      <div data-lbl style="position:absolute;left:0;right:0;top:${cy + 92 * U}px;text-align:center;font:700 ${40 * U}px Helvetica;letter-spacing:.32em;color:${th.acc}">${c.label || ""}</div>

  draw(el, c, t) { fullIO(el, c, t); animBg(el, t, c.start); const g = el._g, q = s => el.querySelector(s);

// ---------- subtítulos ----------
function buildChunks(words, S) {
  const fixes = S.fixes || {};
  const clean = w => { let x = w.replace(/[.,;:¡!¿?…"“”]/g, ""); for (const [a, b] of Object.entries(fixes)) if (x.toLowerCase() === a.toLowerCase()) x = b; return x; };
  const keys = (S.keywords || []).map(k => k.toLowerCase());
  const out = []; let cur = [];
  const flush = () => { if (cur.length) out.push(cur); cur = []; };
  words.forEach((w, i) => {
    const txt = clean(w.w); if (!txt) return;
    const prev = words[i - 1];
    if (cur.length && (cur.length >= (S.maxWords || 3) || cur.map(x => x.t).join(" ").length + txt.length > (S.maxChars || 16) ||
        (prev && /[.,;:?!…]$/.test(prev.w)) || (prev && w.s - prev.e > 0.28))) flush();
    cur.push({ t: txt, s: w.s, e: w.e, key: /\d/.test(txt) || keys.includes(txt.toLowerCase()) });
  });
  flush();
  return out.map((ws, k) => ({ ws, s: ws[0].s, e: Math.min(ws[ws.length - 1].e + .45, out[k + 1] ? out[k + 1][0].s : 1e9) }));

let subsEl;
// Estilos de subtítulos sacados de las referencias, con las fuentes instaladas en esta Mac.

  editorial: { font: '"Big Caslon", "Bodoni 72"', weight: 700, color: "#fff", keyFont: '"Chamberi Headline"', keyItalic: true, keyColor: "#FF4A1C", keyScale: 1.3, reveal: "word", blur: true,
               size: 92, y: .60, maxWords: 3, maxChars: 18, shadow: "0 6px 22px rgba(0,0,0,.45)" },   // ref7
  swiss:     { font: "Helvetica", weight: 700, spacing: "-.045em", color: "#fff", keyColor: "#E3141F", keyScale: 1.4, smallWords: .58, reveal: "word", blur: true,

  clean:     { font: '"Alliance No.2"', weight: 400, color: "#fff", keyFont: '"Chamberi Text"', keyItalic: true, keyColor: "#3BD16F", keyScale: 1.15, reveal: "word", blur: true,
               size: 84, y: .64, maxWords: 3, maxChars: 20, shadow: "0 4px 16px rgba(0,0,0,.45)" },   // ref9
  italic:    { font: "Coolvetica", italic: true, weight: 400, color: "#fff", keyColor: "#F0BE2C", reveal: "word", blur: true, size: 84, y: .66, maxWords: 3, maxChars: 20,
               shadow: "0 4px 14px rgba(0,0,0,.5)" },   // ref4
  hand:      { font: "Noteworthy", weight: 700, color: "#fff", keyColor: "#F5B547", reveal: "word", blur: true, size: 86, y: .66, maxWords: 3, maxChars: 20,
               shadow: "0 0 18px rgba(255,190,90,.55), 0 4px 14px rgba(0,0,0,.5)" },   // ref13
  glow:      { font: "Helvetica", weight: 700, upper: true, color: "#fff", keyColor: "#9B5CFF", keyGlow: "0 0 24px rgba(155,92,255,.85)", reveal: "word", blur: true,
               size: 82, y: .64, maxWords: 3, maxChars: 18, shadow: "0 4px 14px rgba(0,0,0,.45)" },   // ref10

const SMALL_WORDS = new Set("a al de del el en la las lo los mi se su sus te tu un una y o que con por para es ya no si".split(" "));
function subStyle() { const S = E.subs || {}; const o = Object.assign({}, SUB_PRESETS[S.preset || "marino"], S);
  if (!o.allowSizes) { o.keyScale = 1; o.smallWords = 0; }   // regla: todas las letras del mismo tamaño, nunca cambian
  return o; }
function drawSubs(t, fullOn) {
  const S = subStyle();

  const ch = chunks.find(c => t >= c.s && t < c.e);
  if (!ch) { subsEl.classList.add("hide"); return; }
  subsEl.classList.remove("hide");
  if (subsEl._ch !== ch) {
    subsEl._ch = ch;
    const size = S.size * U, stroke = (S.stroke || 0) * U;
    subsEl.innerHTML = `<div class="line">${ch.ws.map(w => {
      const key = w.key, small = S.smallWords && !key && SMALL_WORDS.has(w.t.toLowerCase());
      const fs_ = size * (key ? (S.keyScale || 1) : small ? S.smallWords : 1);
      const txt = S.upper ? w.t.toUpperCase() : w.t;
      return `<span class="sw${key ? " key" : ""}" style="font-family:${(key && S.keyFont ? S.keyFont : S.font).replace(/"/g, "'")};font-weight:${S.weight};font-style:${(key && S.keyItalic) || S.italic ? "italic" : "normal"};
        font-size:${fs_}px;letter-spacing:${S.spacing || "0"};color:${key ? S.keyColor : S.color};-webkit-text-stroke:${stroke ? stroke + "px var(--ink)" : "0"};paint-order:stroke fill;
        text-shadow:${key && S.keyGlow ? S.keyGlow : S.shadow || "0 .08em .3em rgba(0,0,0,.35)"};${S.active === "pill" ? "" : "background:none;padding:0 .08em"}">${txt}</span>`;

  else { line.style.transform = ""; line.style.opacity = 1; }

}

let flashEl;
